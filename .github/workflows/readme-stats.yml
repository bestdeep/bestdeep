name: Update README stats cards

# Generates the GitHub stats cards into profile/ once a day, so the profile
# README does not depend on a hosted stats service staying up.
# Optional: add a repo secret STATS_TOKEN (classic PAT with repo + read:user)
# to include private repositories; otherwise the built-in token is used.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: >-
            {"username": "bestdeep", "show_icons": true, "theme": "tokyonight",
            "hide_border": true, "hide_rank": true, "show": "contributions",
            "include_all_commits": true, "hide": "issues",
            "custom_title": "Lucky Star's GitHub Stats"}
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: >-
            {"username": "bestdeep", "layout": "compact", "theme": "tokyonight",
            "hide_border": true, "langs_count": 5, "exclude_repo": "ai",
            "size_weight": 0.5, "count_weight": 0.5}
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
